<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self';" />
    <title>DeadLine</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="widget-shell layout-cards">
      <div class="ambient-glow glow-one"></div>
      <div class="ambient-glow glow-two"></div>

      <header class="topbar drag-region">
        <div class="brand no-drag">
          <span class="brand-mark">☠</span>
          <span class="brand-copy"><strong>DeadLine</strong></span>
        </div>
        <div class="window-actions no-drag">
          <button class="settings-trigger icon-settings" id="settings-trigger" title="Открыть настройки" aria-label="Открыть настройки">⚙</button>
          <button class="icon-button close-button" id="close-button" title="Закрыть виджет" aria-label="Закрыть виджет">×</button>
        </div>
      </header>

      <section class="widget-content">
        <div class="skeleton-column">
          <div class="skeleton-stage" id="skeleton-stage">
            <img class="skeleton-image" id="skeleton-image" src="assets/skeleton-classic.gif" alt="Классический скелет" />
            <button class="head-hotspot" id="head-color-trigger" type="button" title="Нажмите на скелет, чтобы сменить цвет" aria-label="Сменить цвет скелета"></button>
            <div class="ground-shadow"></div>
          </div>
        </div>

        <div class="details-column">
          <div class="event-copy">
            <p class="kicker">СЛЕДУЮЩЕЕ СОБЫТИЕ</p>
            <h1 id="event-title">Отпуск</h1>
            <p class="event-meta"><span id="event-date-label">01 ИЮН 2027</span><span class="slash">/</span><span id="event-time-label">09:00</span></p>
          </div>

          <div class="countdown-head">
            <span id="countdown-caption">До события</span>
            <span class="live-indicator"><i></i> СИНХРОНИЗИРОВАНО</span>
          </div>

          <div class="countdown-grid" id="countdown-grid" aria-label="Оставшееся время">
            <div class="time-unit"><strong id="months">01</strong><span>МЕС</span></div>
            <div class="time-unit"><strong id="days">27</strong><span>ДН</span></div>
            <div class="time-unit"><strong id="hours">14</strong><span>Ч</span></div>
            <div class="time-unit"><strong id="minutes">08</strong><span>МИН</span></div>
            <div class="time-unit seconds-unit"><strong id="seconds">33</strong><span>СЕК</span></div>
          </div>
        </div>
      </section>

    </main>
    <script src="renderer.js"></script>
  </body>
</html>
